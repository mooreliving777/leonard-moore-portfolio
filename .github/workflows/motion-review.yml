name: Portfolio motion review
on:
  pull_request:
permissions:
  contents: read
jobs:
  motion-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate JavaScript syntax
        run: node --check script.js && node --check motion.js
      - name: Existing educational sample tests
        run: node --test samples/invoice.test.mjs
      - name: Install test-only browser client
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Responsive motion and accessibility smoke tests
        run: node scripts/motion-smoke.mjs
